name: Build and Typecheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Combat and animation tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for art intake validation
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==11.3.0
      - name: Ali V6 synthetic 18-frame rebuild and negative security tests
        run: python -m unittest discover -s tests -p 'test_ali_light3_pipeline.py' -v
      - name: Typecheck and bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser gameplay tests
        run: npm run test:e2e
      - name: Generic sprite rendering tests (synthetic art only)
        run: npm run test:atlas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
